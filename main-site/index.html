<!doctype html>
<html lang="en">

<head>
    <!-- Apply saved theme before first paint to avoid a flash of the wrong colour -->
    <script>
        (function () {
            var k = 'norway';
            try {
                var m = localStorage.getItem(k + '.mode') || 'light';
                var c = localStorage.getItem(k + '.colorTheme') || localStorage.getItem('norway-theme') || 'classic';
                document.documentElement.setAttribute('data-mode', m);
                document.documentElement.setAttribute('data-color-theme', c);
            } catch (e) {
                document.documentElement.setAttribute('data-mode', 'light');
                document.documentElement.setAttribute('data-color-theme', 'classic');
            }
        })();
    </script>

    <!-- Google tag (gtag.js) -->

    <div class="modal-backdrop hidden" id="themeModal">

            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
