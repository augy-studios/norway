<!doctype html>
<html lang="en">

<head>
    <!-- Apply saved theme before first paint to avoid a flash of the wrong colour -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('norway-theme') || 'classic';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'classic');
            }
        })();
    </script>

    <!-- Google tag (gtag.js) -->

<body>
